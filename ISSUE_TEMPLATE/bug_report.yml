name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Production / staging / local, browser or app version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any customer data or secrets before pasting.
